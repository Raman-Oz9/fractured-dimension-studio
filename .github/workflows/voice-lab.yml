name: Voice Lab (all male voices)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install kokoro soundfile numpy
      - name: Generate Adam and Daniel at three depths
        run: |
          python -m pip install .
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          from fractured_dimension.voice import generate_voice_lines
          text = "The bus stopped at a station that was not on any map. The doors opened. And something cold stepped inside."
          out = Path("samples"); out.mkdir(exist_ok=True)
          for voice, tag in (("am_adam", "ADAM"), ("bm_daniel", "DANIEL")):
              for depth in (1.5, 2.5, 3.5):
                  os.environ.update(KOKORO_VOICE=voice, KOKORO_SPEED="0.85", VOICE_DEPTH=str(depth), VOICE_STYLE="natural")
                  name = f"{tag}-depth{depth}"
                  wav = generate_voice_lines([text], out / "w", name)[0]
                  subprocess.run(["ffmpeg","-y","-v","error","-i",str(wav),"-b:a","128k",str(out / f"{name}.mp3")], check=True)
          PY
          rm -rf samples/w
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: samples/*.mp3
      - name: Publish samples to the voice-samples branch
        run: |
          mkdir /tmp/pub && cp samples/*.mp3 /tmp/pub/ && cd /tmp/pub
          git init -q -b voice-samples && git config user.name github-actions && git config user.email actions@users.noreply.github.com
          git add -A && git commit -q -m samples
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" voice-samples
