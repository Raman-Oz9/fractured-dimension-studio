name: Voice Lab (all male voices)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install kokoro soundfile numpy
      - name: Generate one sample per voice
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import numpy as np, soundfile as sf
          from kokoro import KPipeline
          text = "The bus stopped at a station that was not on any map. The doors opened. And something cold stepped inside."
          out = Path("samples"); out.mkdir(exist_ok=True)
          voices = ["am_adam","am_echo","am_eric","am_fenrir","am_liam","am_michael","am_onyx","am_puck","am_santa","bm_daniel","bm_fable","bm_george","bm_lewis"]
          pa, pb = KPipeline(lang_code="a"), KPipeline(lang_code="b")
          for v in voices:
              p = pb if v.startswith("b") else pa
              a = np.concatenate([np.asarray(r.audio.detach().cpu().numpy() if hasattr(r.audio,"detach") else r.audio).reshape(-1) for r in p(text, voice=v, speed=0.92) if r.audio is not None])
              sf.write(str(out / f"{v}.wav"), a, 24000)
          PY
          cd samples && for f in *.wav; do ffmpeg -v error -y -i $f -b:a 128k ${f%.wav}.mp3; done
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: samples/*.mp3
      - name: Publish samples to the voice-samples branch
        run: |
          mkdir /tmp/pub && cp samples/*.mp3 /tmp/pub/ && cd /tmp/pub
          git init -q -b voice-samples && git config user.name github-actions && git config user.email actions@users.noreply.github.com
          git add -A && git commit -q -m samples
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" voice-samples
