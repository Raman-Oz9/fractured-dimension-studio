name: Generate Fractured Dimension Video

on:
  workflow_dispatch:
    inputs:
      overwrite_images:
        description: Regenerate images even if they already exist
        required: false
        type: boolean
        default: false
      narrator:
        description: VoiceStudio narrator profile
        required: true
        type: choice
        options:
          - George
          - Michael
          - Liam
        default: George

permissions:
  contents: read

jobs:
  generate-and-render:
    runs-on: ubuntu-latest
    env:
      VOICESTUDIO_BASE_URL: ${{ secrets.VOICESTUDIO_BASE_URL }}
      VOICESTUDIO_API_KEY: ${{ secrets.VOICESTUDIO_API_KEY }}
      VOICESTUDIO_VOICE: ${{ inputs.narrator }}
      VOICESTUDIO_MODEL: tts-1
      VOICESTUDIO_SPEED: "0.92"
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install project
        run: python -m pip install .

      - name: Verify VoiceStudio configuration
        env:
          VOICESTUDIO_BASE_URL: ${{ secrets.VOICESTUDIO_BASE_URL }}
          VOICESTUDIO_API_KEY: ${{ secrets.VOICESTUDIO_API_KEY }}
        run: |
          test -n "$VOICESTUDIO_BASE_URL" || (echo "::error::Add VOICESTUDIO_BASE_URL to repository Actions secrets." && exit 1)
          test -n "$VOICESTUDIO_API_KEY" || (echo "::error::Add VOICESTUDIO_API_KEY to repository Actions secrets." && exit 1)

      - name: Create example story
        run: fractured-dimension create-example --output work/example

      - name: Generate story images
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "${{ inputs.overwrite_images }}" = "true" ]; then
            fractured-dimension generate work/example/story.json --overwrite
          else
            fractured-dimension generate work/example/story.json
          fi

      - name: Render vertical video with VoiceStudio narration
        run: fractured-dimension render work/example/story.json --output output/fractured-dimension-short.mp4

      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: fractured-dimension-short
          path: output/fractured-dimension-short.mp4
          if-no-files-found: error

      - name: Upload character sheets and scenes
        uses: actions/upload-artifact@v4
        with:
          name: fractured-dimension-assets
          path: |
            work/example/images/
            work/example/generation-report.json
          if-no-files-found: error
