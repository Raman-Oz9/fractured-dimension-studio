name: Generate Fractured Dimension Video

on:
  push:
    branches: [main]
    paths:
      - "stories/active/story.json"
  workflow_dispatch:
    inputs:
      story_path:
        description: Repository path to the story JSON manifest
        required: true
        type: string
        default: stories/active/story.json
      overwrite_images:
        description: Regenerate images even if they already exist
        required: false
        type: boolean
        default: false
      narrator:
        description: Kokoro male narrator voice
        required: true
        type: choice
        options:
          - am_onyx
          - am_liam
          - am_michael
          - am_adam
          - am_puck
          - bm_fable
          - bm_george
        default: am_onyx
      narrator_speed:
        description: Narration speed (1.0 = normal; deep voices read best at 0.95-1.05)
        required: false
        type: string
        default: "0.85"
      narrator_style:
        description: villain = deep, gravelly, menacing; dark = hollow storyteller; natural = clean
        required: false
        type: choice
        options: [villain, dark, natural]
        default: villain
      voice_depth:
        description: Extra narrator depth in semitones (0 = natural, 2 = moody, 3.5 = villain, 5 = extreme)
        required: false
        type: string
        default: "3.5"
      mood:
        description: Soundtrack mood (auto reads the script)
        required: false
        type: choice
        options: [auto, horror, documentary_dark, thriller, mystery, dark_comedy, comedy, epic, sad, wonder]
        default: auto
      voice_backend:
        description: Narration engine
        required: true
        type: choice
        options:
          - kokoro
          - voicestudio
        default: kokoro

permissions:
  contents: write

jobs:
  generate-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VOICE_BACKEND: ${{ inputs.voice_backend || 'kokoro' }}
      KOKORO_VOICE: ${{ inputs.narrator || 'am_onyx' }}
      KOKORO_SPEED: ${{ inputs.narrator_speed || '0.85' }}
      VOICE_DEPTH: ${{ inputs.voice_depth || '3.5' }}
      VOICE_STYLE: ${{ inputs.narrator_style || 'villain' }}
      STORY_MOOD: ${{ inputs.mood == 'auto' && '' || inputs.mood }}
      VOICESTUDIO_BASE_URL: ${{ secrets.VOICESTUDIO_BASE_URL }}
      VOICESTUDIO_API_KEY: ${{ secrets.VOICESTUDIO_API_KEY }}
      VOICESTUDIO_VOICE: ${{ inputs.narrator || 'am_onyx' }}
      VOICESTUDIO_MODEL: tts-1
      VOICESTUDIO_SPEED: "0.92"
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install project and Kokoro TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install kokoro soundfile numpy

      - name: Verify narration configuration
        run: |
          if [ "$VOICE_BACKEND" = "voicestudio" ]; then
            test -n "$VOICESTUDIO_BASE_URL" || (echo "::error::Set VOICESTUDIO_BASE_URL to a reachable VoiceStudio API server." && exit 1)
            test -n "$VOICESTUDIO_API_KEY" || (echo "::error::Set VOICESTUDIO_API_KEY." && exit 1)
          else
            python -c "from kokoro import KPipeline; print('Kokoro import OK')"
          fi

      - name: Select story manifest
        env:
          STORY_PATH_INPUT: ${{ inputs.story_path }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            STORY_PATH="$STORY_PATH_INPUT"
          else
            STORY_PATH="stories/active/story.json"
          fi
          test -f "$STORY_PATH" || (echo "::error::Story manifest not found: $STORY_PATH" && exit 1)
          echo "STORY_PATH=$STORY_PATH" >> "$GITHUB_ENV"
          RENDER_MODE=$(python -c "import json; print(json.load(open('$STORY_PATH')).get('render_mode', 'images'))")
          echo "STORY_RENDER_MODE=$RENDER_MODE" >> "$GITHUB_ENV"

      - name: Generate story images
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OVH_AI_TOKEN: ${{ secrets.OVH_AI_TOKEN }}
          HORDE_API_KEY: ${{ secrets.HORDE_API_KEY }}
        run: |
          if [ "$STORY_RENDER_MODE" = "procedural" ]; then
            echo "Procedural renderer selected; skipping external image generation."
          elif [ "${{ inputs.overwrite_images }}" = "true" ]; then
            fractured-dimension generate "$STORY_PATH" --overwrite
          else
            fractured-dimension generate "$STORY_PATH"
          fi

      - name: Check script-to-picture sync
        run: |
          python -c "
          import sys
          from fractured_dimension.project import load_story, lint_sync
          warnings = lint_sync(load_story('$STORY_PATH'))
          [print('::warning::' + w) for w in warnings]
          "

      - name: Render vertical video with narration
        run: fractured-dimension render "$STORY_PATH" --output output/fractured-dimension-short.mp4

      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: fractured-dimension-short
          path: output/fractured-dimension-short.mp4
          if-no-files-found: error

      - name: Upload character sheets and scenes
        uses: actions/upload-artifact@v4
        with:
          name: fractured-dimension-assets
          path: |
            stories/active/images/
            stories/active/generation-report.json
            stories/active/story.json
          if-no-files-found: ignore

      - name: Voice lab (same line at three villain strengths)
        continue-on-error: true
        run: |
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          from fractured_dimension.voice import generate_voice_lines
          line = "You thought the dark was empty. It was only waiting for you to stop looking."
          out = Path("voice-lab"); out.mkdir(exist_ok=True)
          files = []
          for name, depth, speed in (("A-moody", 2.0, 0.9), ("B-villain", 3.5, 0.85), ("C-extreme", 5.0, 0.82)):
              os.environ["VOICE_DEPTH"], os.environ["KOKORO_SPEED"], os.environ["VOICE_STYLE"] = str(depth), str(speed), "villain"
              files.append(generate_voice_lines([line], out / name, name)[0])
          listing = out / "list.txt"
          listing.write_text("".join(f"file '{f.resolve()}'\nfile '{Path('silence.wav').resolve()}'\n" for f in files))
          subprocess.run(["ffmpeg","-y","-v","error","-f","lavfi","-i","anullsrc=r=24000:cl=mono","-t","1.0",str(Path("silence.wav"))],check=True)
          subprocess.run(["ffmpeg","-y","-v","error","-f","concat","-safe","0","-i",str(listing),"-b:a","128k","voice-lab.mp3"],check=True)
          PY

      - name: Publish test render to the test-renders branch (never uploads to YouTube)
        if: always()
        run: |
          set -e
          D="$(dirname "$STORY_PATH")"
          rm -rf /tmp/pub && mkdir -p /tmp/pub/images
          cp output/fractured-dimension-short.mp4 output/fractured-dimension-short.timeline.json /tmp/pub/ 2>/dev/null || true
          cp "$D"/images/*.png /tmp/pub/images/ 2>/dev/null || true
          cp "$D"/generation-report.json /tmp/pub/ 2>/dev/null || true
          cp voice-lab.mp3 /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub
          git init -q -b test-renders
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Test render ${GITHUB_SHA::7}" || exit 0
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" test-renders
