name: Generate Fractured Dimension Video

on:
  workflow_dispatch:
    inputs:
      overwrite_images:
        description: Regenerate images even if they already exist
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generate-and-render:
    runs-on: ubuntu-latest
    env:
      PIPER_MODEL_PATH: voices/en_US-john-medium.onnx
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install project and offline narration engine
        run: python -m pip install ".[audio]"

      - name: Download deep male Piper voice
        run: |
          mkdir -p voices
          base="https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/john/medium"
          curl --fail --location --retry 3 "$base/en_US-john-medium.onnx" -o "$PIPER_MODEL_PATH"
          curl --fail --location --retry 3 "$base/en_US-john-medium.onnx.json" -o "$PIPER_MODEL_PATH.json"
          curl --fail --location --retry 3 "$base/MODEL_CARD" -o voices/MODEL_CARD-en_US-john-medium.txt

      - name: Create example story
        run: fractured-dimension create-example --output work/example

      - name: Generate story images
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "${{ inputs.overwrite_images }}" = "true" ]; then
            fractured-dimension generate work/example/story.json --overwrite
          else
            fractured-dimension generate work/example/story.json
          fi

      - name: Render vertical video with narration
        run: fractured-dimension render work/example/story.json --output output/fractured-dimension-short.mp4

      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: fractured-dimension-short
          path: output/fractured-dimension-short.mp4
          if-no-files-found: error

      - name: Upload character sheets, scenes and voice license
        uses: actions/upload-artifact@v4
        with:
          name: fractured-dimension-assets
          path: |
            work/example/images/
            work/example/generation-report.json
            voices/MODEL_CARD-en_US-john-medium.txt
          if-no-files-found: error
