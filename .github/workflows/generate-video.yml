name: Generate Fractured Dimension Video

on:
  workflow_dispatch:
    inputs:
      overwrite_images:
        description: Regenerate images even if they already exist
        required: false
        type: boolean
        default: false
      narrator:
        description: Kokoro male narrator voice
        required: true
        type: choice
        options:
          - am_adam
          - bm_george
        default: am_adam
      voice_backend:
        description: Narration engine
        required: true
        type: choice
        options:
          - kokoro
          - voicestudio
        default: kokoro

permissions:
  contents: read

jobs:
  generate-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VOICE_BACKEND: ${{ inputs.voice_backend }}
      KOKORO_VOICE: ${{ inputs.narrator }}
      KOKORO_SPEED: "0.94"
      VOICESTUDIO_BASE_URL: ${{ secrets.VOICESTUDIO_BASE_URL }}
      VOICESTUDIO_API_KEY: ${{ secrets.VOICESTUDIO_API_KEY }}
      VOICESTUDIO_VOICE: ${{ inputs.narrator }}
      VOICESTUDIO_MODEL: tts-1
      VOICESTUDIO_SPEED: "0.92"
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install project and Kokoro TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install kokoro soundfile numpy

      - name: Verify narration configuration
        run: |
          if [ "$VOICE_BACKEND" = "voicestudio" ]; then
            test -n "$VOICESTUDIO_BASE_URL" || (echo "::error::Set VOICESTUDIO_BASE_URL to a reachable VoiceStudio API server." && exit 1)
            test -n "$VOICESTUDIO_API_KEY" || (echo "::error::Set VOICESTUDIO_API_KEY." && exit 1)
          else
            python -c "from kokoro import KPipeline; print('Kokoro import OK')"
          fi

      - name: Create example story
        run: fractured-dimension create-example --output work/example

      - name: Generate story images
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OVH_AI_TOKEN: ${{ secrets.OVH_AI_TOKEN }}
          HORDE_API_KEY: ${{ secrets.HORDE_API_KEY }}
        run: |
          if [ "${{ inputs.overwrite_images }}" = "true" ]; then
            fractured-dimension generate work/example/story.json --overwrite
          else
            fractured-dimension generate work/example/story.json
          fi

      - name: Render vertical video with narration
        run: fractured-dimension render work/example/story.json --output output/fractured-dimension-short.mp4

      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: fractured-dimension-short
          path: output/fractured-dimension-short.mp4
          if-no-files-found: error

      - name: Upload character sheets and scenes
        uses: actions/upload-artifact@v4
        with:
          name: fractured-dimension-assets
          path: |
            work/example/images/
            work/example/generation-report.json
          if-no-files-found: error
